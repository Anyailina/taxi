services:
  postgres:
    image: postgres:latest
    restart: always
    container_name: taxi-dock
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: taxi
    ports:
      - '5433:5432'
    networks:
      - my-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  my-network:
    driver: bridge
volumes:
  postgres-data: